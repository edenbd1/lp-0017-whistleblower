[workspace]
resolver = "2"
members = [
    "crates/registry-core",
    "crates/indexing",
    "crates/batch-anchor",
    "crates/ffi",
]
# methods/guest is a separate workspace — it builds for the
# riscv32im-risc0-zkvm-elf target and pulls in Risc0 + SPEL.
exclude = ["methods/guest"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["edenbd1 <eden.baudin.invest@gmail.com>"]
repository = "https://github.com/edenbd1/lp-0017-whistleblower"

[workspace.dependencies]
# Crypto / serialization
borsh           = { version = "1.5", features = ["derive"] }
serde           = { version = "1",   features = ["derive"] }
serde_json      = "1"
hex             = "0.4"
sha2            = "0.10"
base64          = "0.22"

# Async + HTTP (batch CLI)
tokio           = { version = "1",   features = ["full"] }
reqwest         = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait     = "0.1"
urlencoding     = "2"

# CLI plumbing
clap            = { version = "4",   features = ["derive", "env"] }
anyhow          = "1"
thiserror       = "1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
tempfile        = "3"

[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1
strip     = "symbols"
