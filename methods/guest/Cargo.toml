# SPEL guest crate for the LP-0017 registry.
#
# Builds for `riscv32im-risc0-zkvm-elf` via `cargo risczero build`.
# Separate workspace from the host crates so the RISC-V target
# rustflags / panic strategy don't leak into the host build.
#
# LEZ deps pinned to tag = "v0.2.0-rc3"; SPEL pinned to v0.3.0 (the
# release tagged for that LEZ rev — see docs/decisions/003-ci-with-
# sequencer.md §"Version compatibility").
#
# `ruint = =1.17.0`: the risc0 builder image ships rustc 1.88.0-dev,
# which is older than the rustc-version `ruint >= 1.18.0` declares.
# Pinning to 1.17.0 keeps the build cleanly buildable on the upstream
# Docker image.

[workspace]

[package]
name        = "whistleblower-registry-guest"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "SPEL guest for the LP-0017 CID registry."
publish     = false

[[bin]]
name = "whistleblower_registry"
path = "src/bin/whistleblower_registry.rs"

[dependencies]
# SPEL upstream v0.3.0's #[lez_program] macro fails to compile with a
# `SpelError::custom` type-inference ambiguity (E0283) on rustc 1.88-dev
# inside the risc0 builder image. Until a fix lands upstream we use
# Thompsonmina's `cli-vec-string` fork — the same branch the chronicle
# module uses successfully (see docs/BUGS_FILED.md draft #3). When
# upstream merges the fix, point this back at `tag = "v0.3.0"`.
spel-framework = { git = "https://github.com/Thompsonmina/spel.git",                          branch = "cli-vec-string" }
nssa_core      = { git = "https://github.com/logos-blockchain/logos-execution-zone.git",      tag = "v0.2.0-rc3" }
risc0-zkvm     = { version = "=3.0.5", features = ["std"] }

serde          = { version = "1.0", features = ["derive"] }
borsh          = { version = "1.5", features = ["derive"] }

# See file-level comment for the ruint pin rationale.
ruint          = "=1.17.0"

registry-core  = { path = "../../crates/registry-core", default-features = false }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
