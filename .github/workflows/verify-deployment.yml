name: verify-deployment

# The last recorded run of this workflow is red, and it stays red: it dates from
# 2026-05-22, before the schedule below was commented out, and it cannot be made
# green by re-running. The public LEZ testnet was reset onto a new chain in
# August 2026, so the anchored records this job looks up no longer exist — not
# "went stale", but gone with the generation that held them. Re-running would
# produce a fresh failure that looks like a regression and is not one.
#
# Left as it is rather than deleted, because a workflow removed to tidy a badge
# takes its history with it, and the history is the explanation.
#
# Nightly read-only check against the public Logos devnet (or whichever
# network DEPLOYMENT.md pins). Catches devnet regressions even when
# nothing in the repo changed.
#
# The job is intentionally minimal: install batch-anchor, run `lookup`
# on a known-anchored CID, assert the record decodes.

on:
  # Manual dispatch only until devnet credentials land
  # (docs/DEPLOYMENT.md). Re-enable the schedule below once we have
  # a public registry to query — it's the lowest-cost regression
  # check we ship.
  #
  # schedule:
  #   - cron: '37 5 * * *'   # nightly UTC, 20 min offset from e2e.yml
  workflow_dispatch:

jobs:
  read-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-verify-${{ hashFiles('**/Cargo.lock') }}

      - name: install lgs (devnet read-only)
        run: cargo install --git https://github.com/logos-co/spel.git --tag v0.3.0 spel

      - name: build batch-anchor
        run: cargo build --release -p batch-anchor

      - name: assert known-anchored CID is present
        # The CID + config are pinned in batch-anchor.devnet.toml once
        # DEPLOYMENT.md ships. Until then this job is informational.
        env:
          CONFIG: batch-anchor.devnet.toml
          KNOWN_CID: ${{ vars.KNOWN_ANCHORED_CID }}
        run: |
          if [ ! -f "$CONFIG" ] || [ -z "$KNOWN_CID" ]; then
            echo "devnet config / known CID not yet published — see DEPLOYMENT.md"
            exit 0
          fi
          ./target/release/batch-anchor --config "$CONFIG" lookup "$KNOWN_CID"
