name: e2e

# Slow tier. Spawns `lgs localnet`, brings up the docker-compose stack
# (nwaku + storage), deploys the SPEL guest with `RISC0_DEV_MODE=0`,
# and runs a real anchor round-trip through the batch CLI.
#
# This is the kill-criterion vs Thompson's PR #48 — his CI explicitly
# excludes examples/, methods/guest, ffi/, and the nix flake
# (see docs/recon.md). Ours actually exercises the live path.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'    # nightly UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RISC0_DEV_MODE: "0"

jobs:
  anchor-roundtrip:
    name: anchor round-trip with RISC0_DEV_MODE=0
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      nwaku:
        image: harbor.status.im/wakuorg/nwaku:v0.38.0
        ports: ['8645:8645']
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8645/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
        env:
          # Note: this only covers the basic relay path; the production
          # demo uses the full docker-compose to wire DiscV5 bootnodes.
          # CI doesn't need them — it publishes + drains on the same
          # node within the same job.
          WAKUNODE2_CMD: ' --rest=true --rest-address=0.0.0.0 --rest-port=8645 --relay=true --cluster-id=2 --num-shards-in-network=8 --store=true --store-message-db-url=sqlite:///tmp/store.sqlite3 '
      storage:
        image: logosstorage/logos-storage-nim:latest
        ports: ['8080:8080']
        env:
          STORAGE_LOG_LEVEL: WARN
          STORAGE_DATA_DIR: /datadir
          STORAGE_LISTEN_ADDRS: /ip4/0.0.0.0/tcp/2345
          STORAGE_API_BINDADDR: 0.0.0.0
          STORAGE_API_PORT: 8080
          STORAGE_REPO_KIND: fs
          STORAGE_STORAGE_QUOTA: "1073741824"
          STORAGE_MAX_PEERS: 16
    steps:
      - uses: actions/checkout@v4

      - name: cache cargo + risc0
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.risc0
            target
            methods/guest/target
          key: ${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', 'methods/guest/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-e2e-

      - uses: dtolnay/rust-toolchain@stable

      - name: install risc0 toolchain
        run: |
          curl -L https://risczero.com/install | bash
          ~/.risc0/bin/rzup install cargo-risczero 3.0.5
          ~/.risc0/bin/rzup install r0vm 3.0.5
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"

      - name: install lgs + spel + wallet
        run: |
          cargo install --git https://github.com/logos-co/spel.git --tag v0.3.0 spel
          cargo install --git https://github.com/logos-blockchain/logos-execution-zone.git --tag v0.2.0-rc3 wallet

      - name: print env (for evaluator video grep)
        run: |
          echo "RISC0_DEV_MODE=$RISC0_DEV_MODE"
          echo "RUSTC=$(rustc --version)"
          echo "CARGO=$(cargo --version)"
          echo "CARGO_RISCZERO=$(cargo risczero --version)"
          echo "SPEL=$(spel --version || echo missing)"
          echo "WALLET=$(wallet --version || echo missing)"

      - name: start lgs localnet (background)
        run: |
          # Some lgs versions ship the sequencer under a different
          # subcommand. The deploy.sh + e2e_anchor test detect whether
          # the sequencer is up via /health; bringing it up here keeps
          # the job's failure mode local to this step.
          # If `lgs localnet start` is unavailable, fall back to the
          # standalone sequencer binary.
          if lgs --help 2>&1 | grep -q localnet; then
            lgs localnet start &
          else
            (cd "$HOME/.cargo/git/checkouts" \
              && find . -type d -name sequencer -print -quit | head -1) \
              || echo "no sequencer crate cached — wallet install will have built it"
            sequencer_service --config sequencer/service/configs/debug/sequencer_config.json &
          fi
          for _ in $(seq 1 90); do
            curl -sS http://127.0.0.1:3040/health && break
            sleep 2
          done

      - name: deploy the SPEL guest
        id: deploy
        run: |
          PROGRAM_ID=$(./scripts/deploy.sh --output-format=hex)
          echo "program_id=$PROGRAM_ID" >> "$GITHUB_OUTPUT"
          echo "PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"

      - name: e2e anchor round-trip
        env:
          PROGRAM_ID: ${{ steps.deploy.outputs.program_id }}
          SEQUENCER_URL: http://127.0.0.1:3040
          NWAKU_URL: http://127.0.0.1:8645
          STORAGE_URL: http://127.0.0.1:8080
          RUST_LOG: info,hyper=warn
        run: |
          cargo test -p batch-anchor --features live-lez \
            --test e2e_anchor -- --include-ignored --nocapture | tee /tmp/e2e-anchor.log

      - name: assert RISC0_DEV_MODE was active
        run: grep -q "RISC0_DEV_MODE=0" /tmp/e2e-anchor.log || (echo "RISC0_DEV_MODE=0 banner missing from test stdout" && exit 1)

      - name: upload e2e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-anchor-log
          path: /tmp/e2e-anchor.log
