[package]
name        = "indexing"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description = "Agnostic document-indexing module for the Logos stack: traits for StorageClient + DeliveryClient + RegistryClient. No app-specific deps; reusable beyond Whistleblower."

[dependencies]
registry-core = { path = "../registry-core" }
async-trait.workspace = true
serde.workspace       = true
serde_json.workspace  = true
sha2.workspace        = true
hex.workspace         = true
base64.workspace      = true
thiserror.workspace   = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["std"]
std     = []
