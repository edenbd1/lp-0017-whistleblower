[package]
name        = "batch-anchor"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description = "Permissionless batch anchor CLI: subscribe to a Logos Delivery topic, dedup against the on-chain registry, submit anchored CIDs in bulk."

[[bin]]
name = "batch-anchor"
path = "src/main.rs"

[dependencies]
registry-core = { path = "../registry-core" }
indexing      = { path = "../indexing" }

clap.workspace               = true
tokio.workspace              = true
reqwest.workspace            = true
async-trait.workspace        = true
serde.workspace              = true
serde_json.workspace         = true
hex.workspace                = true
base64.workspace             = true
urlencoding.workspace        = true
anyhow.workspace             = true
thiserror.workspace          = true
tracing.workspace            = true
tracing-subscriber.workspace = true

[features]
default   = []
# Gates ignored e2e tests against a running sequencer (CI e2e tier).
live-lez  = []
