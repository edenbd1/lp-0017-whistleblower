# Local-sequencer config for batch-anchor.
#
# Generated by scripts/demo.sh after the first successful deploy. The
# program_id below pins the registry program at its deterministic
# image hash; replace if you rebuild + redeploy.

[delivery]
url = "http://127.0.0.1:8645"
topics = ["/whistleblower/1/document-broadcast/json"]
store_lookback_hours = 24

[storage]
url = "http://127.0.0.1:18080"

[registry]
sequencer_url     = "http://127.0.0.1:3040"
# 64-hex form of the ImageID — matches what `spel inspect` prints.
program_id        = "b904baea7e1adc245a6cd0802fb3c016eaf9bbcaec90989a9a51c75ac6064217"
idl_path          = "./idl/whistleblower_registry.idl.json"
# CbgR... is one of the preconfigured public accounts in LEZ's debug
# wallet. Both preconfigured signers ship with testnet tokens.
signer_account_id = "CbgR6tj5kWx5oziiFptM7jMvrQeYY3Mzaao6ciuhSr2r"

[batch]
flush_size           = 50
flush_interval_secs  = 30
poll_interval_secs   = 2
